<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Academic homepage of Junjie He, a Biomedical Engineering graduate student at Dalian University of Technology.">
  <title>Junjie He | Academic Homepage</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #16322b;
      --ink-soft: #31554b;
      --green: #0c6c56;
      --paper: #f6f8f5;
      --mint: #c9e6d4;
      --sage: #d8e5c7;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      min-width: 320px;
      margin: 0;
      overflow-x: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    main {
      position: relative;
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
      overflow: hidden;
    }

    main::before,
    main::after {
      position: absolute;
      z-index: 0;
      border-radius: 50%;
      content: "";
      filter: blur(72px);
      opacity: .72;
    }

    main::before {
      top: 8%;
      left: -120px;
      width: 300px;
      height: 300px;
      background: var(--mint);
    }

    main::after {
      right: -100px;
      bottom: -140px;
      width: 400px;
      height: 400px;
      background: var(--sage);
    }

    article {
      position: relative;
      z-index: 1;
      width: min(100%, 720px);
      padding: 64px 0;
      border-top: 1px solid rgb(22 50 43 / 16%);
      border-bottom: 1px solid rgb(22 50 43 / 16%);
    }

    .eyebrow {
      margin: 0;
      color: var(--green);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .2em;
    }

    h1 {
      margin: 24px 0 0;
      color: #123d33;
      font-size: clamp(48px, 10vw, 88px);
      letter-spacing: -.055em;
      line-height: .95;
    }

    .chinese-name {
      margin: 14px 0 0;
      color: var(--ink-soft);
      font-size: 20px;
